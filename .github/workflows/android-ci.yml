name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build, Lint & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Validate Centralized Version Configuration
        run: |
          if [ ! -f "version.properties" ]; then
            echo "::error::version.properties missing from repository root."
            exit 1
          fi
          V_NAME=$(grep "^VERSION_NAME=" version.properties | cut -d'=' -f2)
          V_CODE=$(grep "^VERSION_CODE=" version.properties | cut -d'=' -f2)
          echo "Validating CalVer VERSION_NAME=${V_NAME} and VERSION_CODE=${V_CODE}"
          if [[ ! "${V_NAME}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error::VERSION_NAME '${V_NAME}' is not a valid CalVer format (YYYY.MM.PATCH)."
            exit 1
          fi
          if [ "${V_CODE}" -le 1 ]; then
            echo "::error::VERSION_CODE '${V_CODE}' must be strictly greater than 1."
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --console=plain --continue || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Validate Release Build Variant
        run: ./gradlew assembleRelease --console=plain

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Portly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Android Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer release version (YYYY.MM.PATCH e.g. 2026.11.0)'
        required: false
        type: string
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]+'
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-publish-stable:
    name: Build & Publish Stable Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Determine & Validate Release Version
        id: version_step
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_TAG="${{ github.event.inputs.version }}"
          fi
          
          # Normalize version (remove optional leading 'v' for standard CalVer)
          CLEAN_VER="${RAW_TAG#v}"
          echo "VERSION=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${CLEAN_VER} (Tag: ${RAW_TAG})"
          
          # CalVer format validation: YYYY.MM.PATCH or SemVer X.Y.Z
          if [[ ! "${CLEAN_VER}" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]+|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid version format '${CLEAN_VER}'. Must follow CalVer (YYYY.MM.PATCH e.g. 2026.11.0) or SemVer (X.Y.Z)."
            exit 1
          fi

      - name: Run Full Test Suite
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode Production Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/portly-release.keystore
            echo "KEYSTORE_PATH=/tmp/portly-release.keystore" >> $GITHUB_OUTPUT
            echo "Keystore successfully decoded from protected secret."
          else
            echo "KEYSTORE_PATH=app/release-test.keystore" >> $GITHUB_OUTPUT
            echo "Notice: ANDROID_KEYSTORE_BASE64 not configured, falling back to build release keystore."
          fi

      - name: Build Production Release APK
        env:
          PORTLY_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.KEYSTORE_PATH }}
          PORTLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'portly-release-test' }}
          PORTLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'portly-test' }}
          PORTLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'portly-release-test' }}
        run: ./gradlew assembleRelease --console=plain

      - name: Package Release Assets & Generate Source Archive
        id: package_assets
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found after assembleRelease."
            exit 1
          fi

          # Standard release APK filenames
          APK_CANONICAL="Portly-${VERSION}.apk"
          APK_UNIVERSAL="Portly-${VERSION}-universal.apk"
          SOURCE_ZIP="Portly-${VERSION}-source.zip"
          CHECKSUMS_FILE="Portly-${VERSION}-checksums.txt"
          
          cp "$APK_SRC" "$APK_CANONICAL"
          cp "$APK_SRC" "$APK_UNIVERSAL"
          
          # Generate Exact Corresponding Source Archive (GPL-3.0 Compliance)
          git archive --format=zip --prefix="Portly-${VERSION}/" HEAD -o "$SOURCE_ZIP"
          
          # Generate SHA-256 Checksums
          sha256sum "$APK_CANONICAL" "$APK_UNIVERSAL" "$SOURCE_ZIP" CHANGELOG.md > "$CHECKSUMS_FILE"
          cp "$CHECKSUMS_FILE" SHA256SUMS.txt
          
          SHA256_APK=$(sha256sum "$APK_CANONICAL" | awk '{print $1}')
          echo "SHA256=${SHA256_APK}" >> $GITHUB_OUTPUT
          
          # Verify APK signature and extract certificate fingerprint (print last field, which is the hex digest)
          CERT_FINGERPRINT=$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK_CANONICAL" | grep "SHA-256 digest:" | head -n 1 | awk '{print $NF}' || echo "")
          echo "CERT_FINGERPRINT=${CERT_FINGERPRINT}" >> $GITHUB_OUTPUT
          
          # Extract exact build metadata
          VERSION_CODE=$(grep "^VERSION_CODE=" version.properties | cut -d'=' -f2)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=202611000
          fi
          APK_SIZE=$(wc -c < "$APK_CANONICAL" | tr -d ' ')
          TODAY=$(date -u +%Y-%m-%d)
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Generate update-metadata.json for In-App Auto-Update System
          cat <<EOF > update-metadata.json
          {
            "schemaVersion": 1,
            "applicationId": "com.portly.app",
            "channel": "stable",
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "releaseTag": "${{ steps.version_step.outputs.TAG_NAME }}",
            "releaseDate": "${TODAY}",
            "minimumSupportedVersion": "1.0.0",
            "mandatory": false,
            "releaseNotes": "Portly ${VERSION} CalVer release with Glassmorphism Browser Access, universal in-browser file reading, and centralized release management.",
            "assets": {
              "apk": "${APK_UNIVERSAL}",
              "checksum": "SHA256SUMS.txt"
            },
            "sha256": "${SHA256_APK}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.TAG_NAME }}/${APK_UNIVERSAL}",
            "versionName": "${VERSION}",
            "releaseChannel": "STABLE",
            "publishedAt": "${PUB_DATE}",
            "minSupportedSdk": 26,
            "apkDownloadUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.TAG_NAME }}/${APK_UNIVERSAL}",
            "apkSha256": "${SHA256_APK}",
            "apkSizeBytes": ${APK_SIZE},
            "signingCertificateFingerprint": "${CERT_FINGERPRINT}",
            "htmlUrl": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version_step.outputs.TAG_NAME }}"
          }
          EOF
          
          echo "Assets packaged successfully: $APK_CANONICAL, $SOURCE_ZIP, $CHECKSUMS_FILE, update-metadata.json"

      - name: Prepare Standardized Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          TODAY=$(date -u +%Y-%m-%d)
          SHA256_APK="${{ steps.package_assets.outputs.SHA256 }}"
          
          cat <<EOF > RELEASE_DESCRIPTION.md
          # Portly ${VERSION}

          **Release Type:** Stable Release  
          **Release Date:** ${TODAY}  
          **Android Version:** ${VERSION}  
          **License:** GNU General Public License v3.0 or later (GPL-3.0-or-later)

          ### What's New & Improvements
          - **UI Polish**: Symmetrical top status bar alignment across all screens.
          - **Quick Connect Overhaul**: Protocol-aware badges, default port indicators, automatic scheme prefixes, one-tap "Fill Example", and direct credential profile navigation.
          - **Network Guidance**: Helpful tips for transferring files over Wi-Fi vs. Cellular data.
          - **Centralized CalVer Management**: Strict calendar versioning (\`YYYY.MM.PATCH\`) with monotonically increasing Android \`versionCode\`.
          - **Automatic Update Fix**: Verified official GitHub repository distribution (\`OffensiveKrish/Portly\`).

          ### Compatibility
          - **Minimum Supported Android Version:** Android 8.0 (API 26)
          - **Target Android Version:** Android 17 (API 37)
          - **Supported Architectures:** \`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\` (Universal APK)

          ### Downloads & Verification
          - **Production APK:** [\`Portly-${VERSION}.apk\`](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.TAG_NAME }}/Portly-${VERSION}.apk)
          - **Corresponding Source Code:** [\`Portly-${VERSION}-source.zip\`](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.TAG_NAME }}/Portly-${VERSION}-source.zip)
          - **SHA-256 Checksum:** \`${SHA256_APK}\`
          - **Checksums File:** [\`Portly-${VERSION}-checksums.txt\`](https://github.com/${{ github.repository }}/releases/download/${{ steps.version_step.outputs.TAG_NAME }}/Portly-${VERSION}-checksums.txt)

          ### Installation / Upgrade
          1. Download \`Portly-${VERSION}.apk\` to your Android device.
          2. Open the downloaded APK and confirm installation via the Android Package Installer.
          3. If upgrading from an existing installation, all connection profiles and settings are preserved automatically.

          ### Known Issues
          - None currently known.
          EOF

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.TAG_NAME }}
          prerelease: false
          make_latest: true
          name: "Portly ${{ steps.version_step.outputs.VERSION }}"
          body_path: RELEASE_DESCRIPTION.md
          files: |
            Portly-${{ steps.version_step.outputs.VERSION }}.apk
            Portly-${{ steps.version_step.outputs.VERSION }}-universal.apk
            Portly-${{ steps.version_step.outputs.VERSION }}-source.zip
            Portly-${{ steps.version_step.outputs.VERSION }}-checksums.txt
            SHA256SUMS.txt
            update-metadata.json
            CHANGELOG.md

name: Android Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact CalVer version from version.properties (YYYY.MM.PATCH)"
        required: true
        type: string
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"

permissions:
  contents: write

concurrency:
  group: portly-stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish-stable:
    name: Build & Publish Stable Production Release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Exact Release Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Validate CalVer, Android Version Code and Tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PROP_VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties | tail -n 1)"
          PROP_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties | tail -n 1)"
          if [[ -z "$PROP_VERSION" || -z "$PROP_CODE" ]]; then
            echo "::error::version.properties must define VERSION_NAME and VERSION_CODE."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_VERSION"
            if [[ -z "$RELEASE_TAG" ]]; then
              echo "::error::Provide the CalVer version to publish."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $RELEASE_TAG already exists. Published versions must never be reused."
              exit 1
            fi
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::Invalid stable CalVer tag: $RELEASE_TAG. Expected YYYY.MM.PATCH."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$PROP_VERSION" ]]; then
            echo "::error::Release tag ($RELEASE_TAG) must exactly match version.properties VERSION_NAME ($PROP_VERSION)."
            exit 1
          fi

          IFS='.' read -r YEAR MONTH PATCH <<< "$RELEASE_TAG"
          EXPECTED_CODE=$((YEAR * 100000 + 10#$MONTH * 1000 + PATCH))
          if [[ ! "$PROP_CODE" =~ ^[0-9]+$ ]] || (( PROP_CODE != EXPECTED_CODE )); then
            echo "::error::VERSION_CODE ($PROP_CODE) must equal YYYY*100000 + MM*1000 + PATCH ($EXPECTED_CODE)."
            exit 1
          fi
          if (( PROP_CODE > 2100000000 )); then
            echo "::error::Android versionCode exceeds the supported maximum."
            exit 1
          fi

          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$PROP_CODE" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated Portly $RELEASE_TAG (versionCode $PROP_CODE)."

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Require Production Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production signing secret $name is not configured. Refusing to publish a test-signed APK."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/portly-release.keystore
          test -s /tmp/portly-release.keystore

      - name: Build Signed Production APK
        env:
          PORTLY_KEYSTORE_PATH: /tmp/portly-release.keystore
          PORTLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PORTLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PORTLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --console=plain

      - name: Verify APK Identity and Package Release Assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [[ -z "$APK_SRC" || ! -f "$APK_SRC" ]]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKANALYZER" || -z "$APKSIGNER" ]]; then
            echo "::error::Android apkanalyzer/apksigner tools are unavailable."
            exit 1
          fi

          BUILT_NAME="$("$APKANALYZER" manifest version-name "$APK_SRC")"
          BUILT_CODE="$("$APKANALYZER" manifest version-code "$APK_SRC")"
          if [[ "$BUILT_NAME" != "$VERSION" || "$BUILT_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "::error::APK identity mismatch. Built $BUILT_NAME ($BUILT_CODE), expected $VERSION ($EXPECTED_VERSION_CODE)."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_SRC"
          CERT_FINGERPRINT="$("$APKSIGNER" verify --print-certs "$APK_SRC" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          if [[ -z "$CERT_FINGERPRINT" ]]; then
            echo "::error::Could not extract APK signing certificate fingerprint."
            exit 1
          fi

          APK_CANONICAL="Portly-$VERSION.apk"
          APK_UNIVERSAL="Portly-$VERSION-universal.apk"
          SOURCE_ZIP="Portly-$VERSION-source.zip"
          CHECKSUMS_FILE="Portly-$VERSION-checksums.txt"
          cp "$APK_SRC" "$APK_CANONICAL"
          cp "$APK_SRC" "$APK_UNIVERSAL"
          git archive --format=zip --prefix="Portly-$VERSION/" HEAD -o "$SOURCE_ZIP"

          sha256sum "$APK_CANONICAL" "$APK_UNIVERSAL" "$SOURCE_ZIP" CHANGELOG.md > "$CHECKSUMS_FILE"
          cp "$CHECKSUMS_FILE" SHA256SUMS.txt

          APK_SHA256="$(sha256sum "$APK_CANONICAL" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_CANONICAL")"
          cat > update-metadata.json <<EOF
          {
            "versionName": "$VERSION",
            "versionCode": $EXPECTED_VERSION_CODE,
            "releaseChannel": "STABLE",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minSupportedSdk": 26,
            "apkDownloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION/$APK_CANONICAL",
            "apkSha256": "$APK_SHA256",
            "apkSizeBytes": $APK_SIZE,
            "signingCertificateFingerprint": "$CERT_FINGERPRINT",
            "htmlUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION"
          }
          EOF

          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "CERT_FINGERPRINT=$CERT_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "APK_CANONICAL=$APK_CANONICAL" >> "$GITHUB_OUTPUT"
          echo "APK_UNIVERSAL=$APK_UNIVERSAL" >> "$GITHUB_OUTPUT"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "CHECKSUMS_FILE=$CHECKSUMS_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          APK_SHA256: ${{ steps.assets.outputs.APK_SHA256 }}
        run: |
          cat > RELEASE_DESCRIPTION.md <<EOF
          # Portly $VERSION

          **Release channel:** Stable  
          **Version:** $VERSION  
          **Android versionCode:** ${{ steps.version.outputs.VERSION_CODE }}  
          **Release date:** $(date -u +%Y-%m-%d)  
          **License:** GPL-3.0-or-later

          This release adopts Portly's official Calendar Versioning format (`YYYY.MM.PATCH`).

          ### Downloads
          - [Universal APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION/Portly-$VERSION-universal.apk)
          - [Corresponding source code](https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION/Portly-$VERSION-source.zip)
          - [SHA-256 checksums](https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION/Portly-$VERSION-checksums.txt)

          **APK SHA-256:** `$APK_SHA256`

          ### Upgrade
          Install the APK over the existing Portly installation. Android will preserve app data when the package ID and signing identity match. If Android rejects the update, do not uninstall the existing app; verify the signing certificate first.

          See the attached CHANGELOG.md for documented changes.
          EOF

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          prerelease: false
          make_latest: true
          name: "Portly ${{ steps.version.outputs.VERSION }}"
          body_path: RELEASE_DESCRIPTION.md
          files: |
            ${{ steps.assets.outputs.APK_CANONICAL }}
            ${{ steps.assets.outputs.APK_UNIVERSAL }}
            ${{ steps.assets.outputs.SOURCE_ZIP }}
            ${{ steps.assets.outputs.CHECKSUMS_FILE }}
            SHA256SUMS.txt
            update-metadata.json
            CHANGELOG.md

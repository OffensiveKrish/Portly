name: Android Beta Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact CalVer pre-release version in version.properties"
        required: true
        type: string
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*-alpha.[0-9]*"
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*-beta.[0-9]*"
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*-rc.[0-9]*"

permissions:
  contents: write

concurrency:
  group: portly-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish-beta:
    name: Build & Publish Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Exact Release Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Validate Pre-release Version and Android Version Code
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PROP_VERSION="$(sed -n 's/^VERSION_NAME=//p' version.properties | tail -n 1)"
          PROP_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties | tail -n 1)"
          if [[ -z "$PROP_VERSION" || ! "$PROP_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version.properties must define VERSION_NAME and numeric VERSION_CODE."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $RELEASE_TAG already exists."
              exit 1
            fi
          else
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]{0,2})-(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            echo "::error::Invalid CalVer pre-release tag: $RELEASE_TAG."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$PROP_VERSION" ]]; then
            echo "::error::Tag ($RELEASE_TAG) must match version.properties VERSION_NAME ($PROP_VERSION)."
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$PROP_CODE" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Require Production Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret $name is not configured."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/portly-release.keystore
          test -s /tmp/portly-release.keystore

      - name: Build Signed Beta APK
        env:
          PORTLY_KEYSTORE_PATH: /tmp/portly-release.keystore
          PORTLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PORTLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PORTLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --console=plain

      - name: Verify APK and Package Beta Assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APK_SRC" && test -n "$APKANALYZER" && test -n "$APKSIGNER"
          BUILT_NAME="$("$APKANALYZER" manifest version-name "$APK_SRC")"
          BUILT_CODE="$("$APKANALYZER" manifest version-code "$APK_SRC")"
          if [[ "$BUILT_NAME" != "$VERSION" || "$BUILT_CODE" != "$EXPECTED_VERSION_CODE" ]]; then
            echo "::error::APK version identity does not match the tagged release."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_SRC"
          CERT_FINGERPRINT="$("$APKSIGNER" verify --print-certs "$APK_SRC" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test -n "$CERT_FINGERPRINT"

          APK_NAME="Portly-$VERSION.apk"
          SOURCE_ZIP="Portly-$VERSION-source.zip"
          CHECKSUMS="Portly-$VERSION-checksums.txt"
          cp "$APK_SRC" "$APK_NAME"
          git archive --format=zip --prefix="Portly-$VERSION/" HEAD -o "$SOURCE_ZIP"
          sha256sum "$APK_NAME" "$SOURCE_ZIP" CHANGELOG.md > "$CHECKSUMS"
          cp "$CHECKSUMS" SHA256SUMS.txt
          APK_SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$APK_NAME")"

          cat > update-metadata.json <<EOF
          {
            "versionName": "$VERSION",
            "versionCode": $EXPECTED_VERSION_CODE,
            "releaseChannel": "BETA",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minSupportedSdk": 26,
            "apkDownloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION/$APK_NAME",
            "apkSha256": "$APK_SHA256",
            "apkSizeBytes": $APK_SIZE,
            "signingCertificateFingerprint": "$CERT_FINGERPRINT",
            "htmlUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION"
          }
          EOF
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"
          echo "CHECKSUMS=$CHECKSUMS" >> "$GITHUB_OUTPUT"

      - name: Publish Beta GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          prerelease: true
          make_latest: false
          name: "Portly ${{ steps.version.outputs.VERSION }} (Beta)"
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.APK_NAME }}
            ${{ steps.assets.outputs.SOURCE_ZIP }}
            ${{ steps.assets.outputs.CHECKSUMS }}
            SHA256SUMS.txt
            update-metadata.json
            CHANGELOG.md

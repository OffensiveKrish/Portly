name: Android Beta Release

on:
  push:
    tags:
      - 'v*-beta*'

permissions:
  contents: write

jobs:
  build-and-publish-beta:
    name: Build & Publish Beta Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Extract Release Version
        id: version_step
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Clean tag: ${TAG_NAME}"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Decode Production Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/portly-release.keystore
            echo "KEYSTORE_PATH=/tmp/portly-release.keystore" >> $GITHUB_OUTPUT
            echo "Keystore successfully decoded."
          else
            echo "KEYSTORE_PATH=" >> $GITHUB_OUTPUT
            echo "Notice: ANDROID_KEYSTORE_BASE64 not configured, falling back to build-in release keystore."
          fi

      - name: Build Release APK
        env:
          PORTLY_KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.KEYSTORE_PATH }}
          PORTLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PORTLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PORTLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Package & Prepare Release Assets
        id: package_assets
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          APK_DEST="Portly-${VERSION}-universal.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          # Generate SHA-256 Checksum
          sha256sum "$APK_DEST" > SHA256SUMS.txt
          SHA256_HASH=$(awk '{print $1}' SHA256SUMS.txt)
          echo "SHA256=${SHA256_HASH}" >> $GITHUB_OUTPUT
          
          # Verify Signature and Extract Certificate Fingerprint
          CERT_FINGERPRINT=$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK_DEST" | grep "SHA-256 digest:" | head -n 1 | awk '{print $3}' || echo "")
          echo "CERT_FINGERPRINT=${CERT_FINGERPRINT}" >> $GITHUB_OUTPUT
          
          # Generate update-metadata.json
          cat <<EOF > update-metadata.json
          {
            "versionName": "${VERSION}",
            "releaseChannel": "BETA",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "minSupportedSdk": 26,
            "apkDownloadUrl": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/${APK_DEST}",
            "apkSha256": "${SHA256_HASH}",
            "signingCertificateFingerprint": "${CERT_FINGERPRINT}",
            "htmlUrl": "https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          }
          EOF
          
          echo "Assets packaged successfully."

      - name: Publish GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          name: "Portly ${{ steps.version_step.outputs.VERSION }} (Beta)"
          generate_release_notes: true
          files: |
            Portly-${{ steps.version_step.outputs.VERSION }}-universal.apk
            SHA256SUMS.txt
            update-metadata.json

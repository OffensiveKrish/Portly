# Portly Centralized Version Management (CalVer: YYYY.MM.PATCH)
# Format: YYYY.MM.PATCH (e.g. 2026.11.1)
# Rules:
# 1. YYYY: Year (2026)
# 2. MM: 2-digit Month (11)
# 3. PATCH: Sequential integer starting at 0 for each month
# 4. versionCode: YYYY * 100000 + MM * 1000 + PATCH (e.g. 202611001)
VERSION_NAME=2026.11.1
VERSION_CODE=202611001
